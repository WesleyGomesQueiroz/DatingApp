<form [formGroup]="registerForm" (ngSubmit)="register()" autocomplete="off">
    <h2 class="text-center text-primary">Sign up</h2>
    <hr>

    <div class="mb-3">
        <label style="margin-right: 10px;">I am a: </label>

        <label style="margin-right: 10px;" class="form-check-label">
            <input style="padding-left: 13px;" type="radio" class="form-check-input" value="male" formControlName="gender"> Male
        </label>
        <label class="form-check-label">
            <input style="padding-left: 13px;" type="radio" class="form-check-input" value="female" formControlName="gender"> Female
        </label>
    </div>

    <app-text-input
        [formControl]="$any(registerForm.controls['username'])"
        [label]="'Username'"
    ></app-text-input>

    <app-text-input
        [formControl]="$any(registerForm.controls['knownAs'])"
        [label]="'knownAs'"
    ></app-text-input>

    <app-text-input
        [formControl]="$any(registerForm.controls['dateOfBirt'])"
        [label]="'Date Of Birt'"
    ></app-text-input>

    <app-text-input
        [formControl]="$any(registerForm.controls['city'])"
        [label]="'City'"
    ></app-text-input>

    <app-text-input
        [formControl]="$any(registerForm.controls['country'])"
        [label]="'Country'"
    ></app-text-input>

    <app-text-input
        [formControl]="$any(registerForm.controls['password'])"
        [label]="'Password'"
        [type]="'password'"
    ></app-text-input>

    <app-text-input
        [formControl]="$any(registerForm.controls['confirmPassword'])"
        [label]="'Confirm Password'"
        [type]="'password'"
    ></app-text-input>
    
    <div class="form-group text-center">
        <button class="btn btn-success me-2" type="submit">Register</button>
        <button class="btn btn-defaukt me-2" (click)="cancel()" type="button">Cancel</button>
    </div>
</form>
